[project]
name = "smart-contract-decompiler"
version = "2.0.0"
description = "Smart contract decompilation and security analysis — EVM bytecode to Solidity via TAC, with vulnerability detection, malicious classification, and audit reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "web3>=6.0,<7",
    "eth-abi>=4.0,<6",
    "eth-utils>=2.0,<5",
    "evmdasm>=0.1,<1",
    "py-solc-x>=2.0,<3",
    "numpy>=1.24,<2",
    "pandas>=2.0,<3",
    "pyarrow",
    "huggingface-hub>=0.17,<1",
    "requests>=2.28,<3",
    "tqdm>=4.65,<5",
    "click>=8.0,<9",
    "pyyaml>=6.0,<7",
    "jsonlines>=3.1,<5",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
inference = [
    "torch>=2.0,<3",
    "transformers>=4.35,<5",
    "datasets>=2.14,<3",
    "accelerate>=1.1,<2",
    "peft>=0.6,<0.19",
]
evaluation = [
    "smart-contract-decompiler[inference]",
    "py-evm>=0.10,<1",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "nltk>=3.8,<4",
    "rouge-score>=0.1,<1",
    "sentence-transformers>=2.2,<4",
]
training = [
    "smart-contract-decompiler[evaluation]",
    "trl>=0.7,<1",
    "wandb>=0.15,<1",
    "tensorboard>=2.14,<3",
    "nvidia-ml-py3>=7.0,<8",
]
quantization = ["smart-contract-decompiler[training]", "bitsandbytes>=0.41,<1"]
web = ["smart-contract-decompiler[inference]", "flask>=3.0,<4", "flask-cors>=4.0,<5"]
analysis = [
    "lightgbm>=4.0,<5",
    "lime>=0.2,<1",
    "shap>=0.42,<1",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
]
cpu = ["torch>=2.0,<3"]
cuda = ["torch>=2.0,<3"]
deepspeed = ["smart-contract-decompiler[training]", "deepspeed>=0.10.0"]
flash-attn = ["smart-contract-decompiler[training]", "flash-attn"]

[dependency-groups]
dev = [
    "pytest>=7.0,<10",
    "black>=23.0,<25",
    "flake8>=6.0,<8",
    "mypy>=1.0,<2",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p no:pytest_ethereum -v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true